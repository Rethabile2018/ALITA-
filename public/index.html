<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ALITA Forex Scanner</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <header class="header">
      <h1>ALITA SCANNER</h1>
      <p>Upload chart → get trade signal</p>
    </header>

    <div class="card">

      <input type="file" id="fileInput" accept="image/*" />

      <button onclick="uploadChart()" class="btn">
        ANALYZE CHART
      </button>

      <div id="preview"></div>

    </div>

    <div class="result-card" id="result">

      <h2>RESULT</h2>

      <div class="grid">
        <div class="box">
          <h3>Signal</h3>
          <p id="signal">---</p>
        </div>

        <div class="box">
          <h3>Entry</h3>
          <p id="entry">---</p>
        </div>

        <div class="box">
          <h3>Stop Loss</h3>
          <p id="sl">---</p>
        </div>

        <div class="box">
          <h3>Take Profit</h3>
          <p id="tp">---</p>
        </div>

        <div class="box full">
          <h3>Confidence</h3>
          <p id="confidence">---</p>
        </div>
      </div>

    </div>

  </div>

  <script src="app.js"></script>

</body>
</html>
